        image: slot.image,
        colorName: 'أنيق',

        category: 'formal',

        cycleRemaining: '18 دقيقة متبقية',

      {

        type: 'bottom',

    // 🌅 WakeUpScreen Component
    // =========================================================================

          const now = new Date();

          const minutes = now.getMinutes().toString().padStart(2, '0');
          const isAm = hours < 12;
          const displayHours = (hours % 12 || 12).toString().padStart(2, '0');
          const period = isAm ? 'ص' : 'م';
          setTime(`${displayHours}:${minutes} ${period}`);

        const interval = setInterval(updateTime, 1000);
        return () => clearInterval(interval);

              </div>
            </div>
          </div>
        </div>
      );
    };

    // =========================================================================
    // ⛅ WeatherWidget Component
    // =========================================================================
    const WeatherWidget = ({ weather, onSelectWeather, availableWeathers }) => {
      const [isOpen, setIsOpen] = useState(false);

      const getWeatherIcon = (icon) => {
        switch (icon) {
          case 'sunny':
            return <Sun className="w-8 h-8 sm:w-10 sm:h-10 text-white stroke-[1.75]" />;
          case 'breeze':
            return <Wind className="w-8 h-8 sm:w-10 sm:h-10 text-sky-200 stroke-[1.75]" />;
          case 'rainy':
            return <CloudRain className="w-8 h-8 sm:w-10 sm:h-10 text-blue-200 stroke-[1.75]" />;
          default:
            return <CloudSun className="w-8 h-8 sm:w-10 sm:h-10 text-amber-200 stroke-[1.75]" />;
        }
      };

      return (
        <div className="relative w-full rounded-3xl bg-[#1E1E2C]/75 backdrop-blur-2xl border border-white/15 p-4 sm:p-5 text-white shadow-2xl overflow-visible transition-all duration-300">
          <div className="flex items-center justify-between mb-3 sm:mb-4">
            <h3 className="text-sm md:text-base font-semibold text-stone-200 font-['Cairo',sans-serif]">
              توقعات اليوم
            </h3>
          </div>

          <div className="flex items-center justify-between px-2">
            <div className="flex items-center justify-center p-2 rounded-2xl bg-white/5 border border-white/10 shadow-inner">
              {getWeatherIcon(weather.icon)}
            </div>

            <div className="text-left">
              <div className="text-3xl sm:text-4xl md:text-5xl font-light tracking-tight font-mono text-white">
                {weather.temperature}°
              </div>
              <div className="text-xs sm:text-sm md:text-base font-medium text-stone-300 text-left mt-0.5">
                {weather.condition === 'Sunny' ? 'مشمس' : weather.conditionArabic.split('-')[1]?.trim() || 'معتدل'}
              </div>
            </div>
          </div>

          {isOpen && (
            <div className="absolute top-full left-0 right-0 mt-2 p-2.5 rounded-2xl bg-[#1E1E2C]/95 backdrop-blur-3xl border border-white/20 shadow-2xl z-40 text-right animate-in fade-in">
              <div className="text-[11px] text-stone-400 font-bold px-2 py-1">
                اختر حالة جوية لاختبار تنسيق الخزانة:
              </div>
              <div className="space-y-1 mt-1">
                {availableWeathers.map((w) => (
                  <button
                    key={w.condition}
                    onClick={() => {
                      onSelectWeather(w);
                      setIsOpen(false);
                    }}
                    className={`w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs transition-colors ${
                      weather.temperature === w.temperature
                        ? 'bg-[#E8A2A8]/20 text-white font-bold border border-[#E8A2A8]/40'
                        : 'text-stone-300 hover:bg-white/10 hover:text-white'
                    }`}
                  >
                    <span>{w.conditionArabic}</span>
                    <span className="font-mono text-[11px]">{w.temperature}°C</span>
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    };

    // =========================================================================
    // 📊 WardrobeStatsWidget Component
    // =========================================================================
    const WardrobeStatsWidget = ({

      topsCount,
      bottomsCount,
      shoesCount,

    }) => {

        <div className="p-4 sm:p-5 rounded-3xl bg-[#1E1E2C]/75 backdrop-blur-2xl border border-white/15 text-white shadow-2xl space-y-3 sm:space-y-4">
          <div className="flex items-center justify-between">
            <h3 className="text-sm md:text-base font-semibold text-stone-200 font-['Cairo',sans-serif]">

            </h3>
            <span className="text-[11px] sm:text-xs text-emerald-400 flex items-center gap-1">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
              مباشر RFID
            </span>
          </div>

          <div className="flex items-baseline justify-between p-3.5 rounded-2xl bg-white/5 border border-white/10">
            <div>
              <div className="text-xs text-stone-400">إجمالي قطع الخزانة</div>
              <div className="text-2xl sm:text-3xl font-extrabold text-white font-mono mt-0.5">

            <div className="text-right">
              <div className="text-[11px] text-stone-400">في سلة الغسيل</div>
              <div className="text-xs sm:text-sm font-bold text-amber-300 font-mono">{laundryCount} قطع</div>
            </div>
          </div>

          <div className="grid grid-cols-3 gap-2 text-center">
            <div className="p-2 sm:p-2.5 rounded-2xl bg-white/5 border border-white/10">
              <div className="text-[10px] text-stone-400">علوي</div>
              <div className="text-xs sm:text-sm font-bold text-white font-mono mt-0.5">{topsCount}</div>
            </div>
            <div className="p-2 sm:p-2.5 rounded-2xl bg-white/5 border border-white/10">
              <div className="text-[10px] text-stone-400">سفلي</div>
              <div className="text-xs sm:text-sm font-bold text-white font-mono mt-0.5">{bottomsCount}</div>
            </div>
            <div className="p-2 sm:p-2.5 rounded-2xl bg-white/5 border border-white/10">

              <div className="text-xs sm:text-sm font-bold text-white font-mono mt-0.5">{shoesCount}</div>
            </div>
          </div>

          <button
            onClick={onOpenLaundryDrawer}
            className="w-full p-2.5 sm:p-3 rounded-2xl bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-200 text-xs font-bold transition-all flex items-center justify-between active:scale-98"
          >
            <div className="flex items-center gap-2">
              <AlertCircle className="w-4 h-4 text-amber-400" />
              <span>قطع قيد الغسيل ({laundryCount})</span>
            </div>
            <ChevronLeft className="w-4 h-4 text-amber-300" />
          </button>
        </div>
      );
    };

    // =========================================================================
    // 🪞 MainMirrorPanel Component
    // =========================================================================
    const HorizontalPhotoRow = ({ title, items, selectedId, selectedImage, onSelectImage }) => {
      const scrollContainerRef = useRef(null);

      const scroll = (direction) => {
        if (scrollContainerRef.current) {
          const scrollAmount = direction === 'left' ? -220 : 220;
          scrollContainerRef.current.scrollBy({ left: scrollAmount, behavior: 'smooth' });
        }
      };

      const handleWheel = (e) => {
        if (scrollContainerRef.current && e.deltaY !== 0) {
          scrollContainerRef.current.scrollLeft += e.deltaY;
        }
      };

      if (!items || items.length === 0) {
        return (
          <div className="p-4 rounded-2xl bg-white/5 border border-white/10 text-center text-xs text-stone-400">
            لا توجد صور مضافة لهذه الفئة حتى الآن.
          </div>
        );
      }

      return (
        <div className="relative group">
          <div className="flex items-center justify-between mb-1.5 px-1">
            <span className="text-xs font-bold text-stone-200 font-['Cairo',sans-serif]">
              {title}
            </span>
            <div className="flex items-center gap-1">
              <button
                onClick={() => scroll('right')}
                className="p-1 rounded-lg bg-white/5 hover:bg-white/15 text-stone-300 hover:text-white transition-all text-xs"
                title="السابق"

              >
                <ChevronLeft className="w-3.5 h-3.5" />
              </button>
            </div>
          </div>

          <div
            ref={scrollContainerRef}
            onWheel={handleWheel}
            className="flex items-center gap-2.5 sm:gap-3 overflow-x-auto overflow-y-hidden py-1.5 px-1 scroll-smooth select-none cursor-grab active:cursor-grabbing no-scrollbar touch-scroll"
            style={{ scrollbarWidth: 'none', msOverflowStyle: 'none' }}
          >
            {items.map((slot) => {
              const cleanSelected = selectedImage ? selectedImage.split('?')[0].split('/').pop() : '';
              const cleanSlot = slot.image ? slot.image.split('?')[0].split('/').pop() : '';
              const isSelected =
                (Boolean(selectedId) && selectedId === slot.id) ||
                (Boolean(selectedImage) && selectedImage === slot.image) ||
                (Boolean(cleanSelected) && Boolean(cleanSlot) && cleanSelected === cleanSlot);

              return (
                <div
                  key={slot.id}
                  onClick={() => onSelectImage(slot)}
                  className={`w-20 h-24 sm:w-28 sm:h-32 shrink-0 rounded-2xl overflow-hidden relative cursor-pointer transition-all duration-300 group/card ${
                    isSelected
                      ? 'ring-2 ring-[#E8A2A8] border-2 border-white scale-105 shadow-xl shadow-[#E8A2A8]/25'
                      : 'border border-white/15 hover:border-[#E8A2A8]/70 hover:scale-102 opacity-80 hover:opacity-100'
                  }`}
                >
                  <img
                    src={slot.image}
                    alt=""
                    referrerPolicy="no-referrer"
                    onError={(e) => {
                      e.currentTarget.src = 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&q=80&w=300';

                    className="w-full h-full object-cover group-hover/card:scale-108 transition-transform duration-500"

    const MainMirrorPanel = ({
      selectedCategory,
      onSelectCategory,
      currentOutfit,
      onUpdatePiece,
      onConfirmOutfit,
      weather,
      allItems,
    }) => {
      const [activeStep, setActiveStep] = useState('styles');
      const [currentTime, setCurrentTime] = useState('7:12 AM');

      useEffect(() => {
        const updateTime = () => {
          const now = new Date();
          const hours = now.getHours();
          const minutes = now.getMinutes().toString().padStart(2, '0');
          const isAm = hours < 12;
          const displayHours = (hours % 12 || 12).toString();
          setCurrentTime(`${displayHours}:${minutes} ${isAm ? 'AM' : 'PM'}`);
        };
        updateTime();
        const interval = setInterval(updateTime, 1000);
        return () => clearInterval(interval);
      }, []);

      const categoryTops = useMemo(() => {
        const list = MANUAL_TOPS_GALLERY.filter((item) => item.category === selectedCategory);
        if (list.length > 0) return list;
        return allItems
          .filter((i) => i.type === 'top' && i.category === selectedCategory)
          .map((i) => ({ id: i.id, image: i.image, category: i.category }));
      }, [selectedCategory, allItems]);

      const categoryBottoms = useMemo(() => {
        const list = MANUAL_BOTTOMS_GALLERY.filter((item) => item.category === selectedCategory);
        if (list.length > 0) return list;
        return allItems
          .filter((i) => i.type === 'bottom' && i.category === selectedCategory)
          .map((i) => ({ id: i.id, image: i.image, category: i.category }));
      }, [selectedCategory, allItems]);

      const categoryShoes = useMemo(() => {
        const list = MANUAL_SHOES_GALLERY.filter((item) => item.category === selectedCategory);
        if (list.length > 0) return list;
        return allItems
          .filter((i) => i.type === 'shoes' && i.category === selectedCategory)
          .map((i) => ({ id: i.id, image: i.image, category: i.category }));
      }, [selectedCategory, allItems]);

      const handleSelectTop = (slot) => {
        const matched = allItems.find((i) => (i.id === slot.id || i.image === slot.image) && i.type === 'top');
        if (matched) {
          onUpdatePiece('top', { ...matched, id: slot.id, image: slot.image, category: slot.category });
        } else {
          onUpdatePiece('top', createClothingItemFromSlot(slot, 'top'));
        }
      };

      const handleSelectBottom = (slot) => {
        const matched = allItems.find((i) => (i.id === slot.id || i.image === slot.image) && i.type === 'bottom');
        if (matched) {
          onUpdatePiece('bottom', { ...matched, id: slot.id, image: slot.image, category: slot.category });
        } else {
          onUpdatePiece('bottom', createClothingItemFromSlot(slot, 'bottom'));
        }
      };

      const handleSelectShoes = (slot) => {
        const matched = allItems.find((i) => (i.id === slot.id || i.image === slot.image) && i.type === 'shoes');
        if (matched) {
          onUpdatePiece('shoes', { ...matched, id: slot.id, image: slot.image, category: slot.category });
        } else {
          onUpdatePiece('shoes', createClothingItemFromSlot(slot, 'shoes'));
        }
      };

      const getCategoryLabel = (cat) => {
        if (cat === 'casual') return 'كاجوال';

                <button

              </p>

                <div className={`p-2 rounded-xl shrink-0 ${isDispensing ? 'bg-amber-400/20 text-amber-300 animate-spin' : 'bg-emerald-400/20 text-emerald-300'}`}>

                <div className="flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse" />

                </button>
              )}
            </div>
          </div>
        </div>
      );
    };

    // =========================================================================
    // 💼 BusinessPitchModal Component
    // =========================================================================
    const BusinessPitchModal = ({ isOpen, onClose }) => {
      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/70 backdrop-blur-md animate-in fade-in duration-200 touch-scroll">
          <div className="relative w-full max-w-2xl max-h-[85vh] sm:max-h-[90vh] overflow-y-auto rounded-3xl bg-[#1E1E2C]/95 backdrop-blur-2xl border border-white/20 p-5 sm:p-8 text-white shadow-2xl">
            <div className="absolute -top-20 -left-20 w-60 h-60 bg-[#D8838B]/25 rounded-full blur-3xl pointer-events-none" />

            <div className="flex items-center justify-between pb-3 sm:pb-4 border-b border-white/10 relative z-10">
              <div className="flex items-center gap-3">
                <div className="p-2 sm:p-2.5 rounded-2xl bg-gradient-to-tr from-[#D8838B] to-[#E8A2A8] text-white">
                  <Sparkles className="w-4 h-4 sm:w-5 sm:h-5" />
                </div>
                <div>
                  <div className="text-[10px] sm:text-xs font-semibold text-[#E8A2A8]">
                    مشروع مساق إدارة وريادة الأعمال الجامعي
                  </div>
                  <h2 className="text-base sm:text-xl font-bold text-white font-['Cairo',sans-serif]">
                    وثيقة مشروع EasyWear Smart Closet
                  </h2>
                </div>
              </div>
              <button
                onClick={onClose}
                className="p-1.5 sm:p-2 rounded-xl bg-white/10 hover:bg-white/20 text-stone-300 hover:text-white transition-colors"
              >
                <X className="w-4 h-4 sm:w-5 sm:h-5" />
              </button>
            </div>

            <div className="my-4 sm:my-6 space-y-4 sm:space-y-5 text-right relative z-10">
              <div className="p-3.5 sm:p-4 rounded-2xl bg-white/5 border border-white/10">
                <div className="flex items-center gap-2 text-xs sm:text-sm font-bold text-[#E8A2A8] mb-1.5">
                  <Compass className="w-4 h-4" />
                  <span>الرؤية (Vision)</span>
                </div>
                <p className="text-xs text-stone-300 leading-relaxed">
                  تحويل كل خزانة منزلية إلى مرآة ذكية تفاعلية فاخرة تمنح المستخدم منسق أزياء شخصي متصل بالواقع والطقس والمهام اليومية، مما يلغي الحيرة الصباحية ويزيد استدامة الأزياء.
                </p>
              </div>

              <div className="p-3.5 sm:p-4 rounded-2xl bg-white/5 border border-white/10">
                <div className="flex items-center gap-2 text-xs sm:text-sm font-bold text-[#E8A2A8] mb-1.5">
                  <Target className="w-4 h-4" />
                  <span>الرسالة (Mission)</span>
                </div>
                <p className="text-xs text-stone-300 leading-relaxed">
                  دمج حلول إنترنت الأشياء (IoT) والواجهات الزجاجية الذكية لتقديم تجربة تنسيق يومية سلسة، موفرة للوقت، ومتصلة بدورة الغسيل والصيانة الذاتية للخزانة بأعلى درجات الأناقة.
                </p>
              </div>

              <div className="p-3.5 sm:p-4 rounded-2xl bg-white/5 border border-white/10">
                <div className="flex items-center gap-2 text-xs sm:text-sm font-bold text-[#E8A2A8] mb-1.5">
                  <Award className="w-4 h-4" />
                  <span>القيمة المقترحة (Value Proposition)</span>
                </div>
                <ul className="space-y-1.5 text-xs text-stone-300">
                  <li className="flex items-center gap-2">
                    <CheckCircle2 className="w-3.5 h-3.5 text-[#E8A2A8] shrink-0" />
                    <span>توفير أكثر من 20 دقيقة من البحث والتجربة يومياً أمام الخزانة.</span>
                  </li>
                  <li className="flex items-center gap-2">
                    <CheckCircle2 className="w-3.5 h-3.5 text-[#E8A2A8] shrink-0" />
                    <span>تنسيق ذكي متوافق لحظياً مع درجات حرارة الطقس وظروف اليوم.</span>
                  </li>
                  <li className="flex items-center gap-2">
                    <CheckCircle2 className="w-3.5 h-3.5 text-[#E8A2A8] shrink-0" />
                    <span>تتبع أوتوماتيكي لقطع الغسيل يمنع اقتراح الملابس غير الجاهزة.</span>
                  </li>
                </ul>
              </div>

              <div className="p-3.5 sm:p-4 rounded-2xl bg-white/5 border border-white/10">
                <div className="flex items-center gap-2 text-xs sm:text-sm font-bold text-[#E8A2A8] mb-2">
                  <TrendingUp className="w-4 h-4" />
                  <span>فريق عمل المشروع (Project Team)</span>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-xs">
                  <div className="p-2 rounded-xl bg-black/20 border border-white/5">
                    <div className="font-bold text-white">إدارة المشروع</div>
                    <div className="text-[9px] sm:text-[10px] text-stone-400 mt-0.5">تطوير الأعمال</div>
                  </div>
                  <div className="p-2 rounded-xl bg-black/20 border border-white/5">
                    <div className="font-bold text-white">تصميم الواجهة</div>
                    <div className="text-[9px] sm:text-[10px] text-stone-400 mt-0.5">تجربة المرآة UX/UI</div>
                  </div>
                  <div className="p-2 rounded-xl bg-black/20 border border-white/5">
                    <div className="font-bold text-white">هندسة IoT</div>
                    <div className="text-[9px] sm:text-[10px] text-stone-400 mt-0.5">الشماعات والأنظمة</div>
                  </div>
                  <div className="p-2 rounded-xl bg-black/20 border border-white/5">
                    <div className="font-bold text-white">التحليل المالي</div>
                    <div className="text-[9px] sm:text-[10px] text-stone-400 mt-0.5">الجدوى والتسعير</div>
                  </div>
                </div>
              </div>
            </div>

            <div className="pt-3 sm:pt-4 border-t border-white/10 flex items-center justify-between gap-2">
              <span className="text-[10px] sm:text-xs text-stone-400">
                مشروع مساق ريادة الأعمال 2026
              </span>
              <button
                onClick={onClose}
                className="px-4 sm:px-6 py-2 sm:py-2.5 rounded-xl bg-gradient-to-r from-[#D8838B] to-[#E8A2A8] text-white text-xs font-bold shadow-md hover:brightness-105 transition-all"
              >
                إغلاق
              </button>
            </div>
          </div>
        </div>
      );
    };

    // =========================================================================
    // 🚀 App Main Component
    // =========================================================================
    function App() {
      const [isAsleep, setIsAsleep] = useState(true);
      const [selectedCategory, setSelectedCategory] = useState('casual');
      const [clothingList, setClothingList] = useState(INITIAL_CLOTHING_ITEMS);
      const [laundryList, setLaundryList] = useState(INITIAL_LAUNDRY_ITEMS);
      const [weatherPresets] = useState(INITIAL_WEATHER_PRESETS);
      const [currentWeather, setCurrentWeather] = useState(INITIAL_WEATHER_PRESETS[0]);

      const [inventoryFilter, setInventoryFilter] = useState('all');
      const [selectedColorFilter, setSelectedColorFilter] = useState(null);

      const [currentOutfit, setCurrentOutfit] = useState(() => {
        const top = clothingList.find((i) => i.type === 'top' && i.category === 'casual') || FALLBACK_ITEM('top', 'casual');
        const bottom = clothingList.find((i) => i.type === 'bottom' && i.category === 'casual') || FALLBACK_ITEM('bottom', 'casual');
        const shoes = clothingList.find((i) => i.type === 'shoes' && i.category === 'casual') || FALLBACK_ITEM('shoes', 'casual');
        return { top, bottom, shoes };
      });

      const [isConfirmModalOpen, setIsConfirmModalOpen] = useState(false);
      const [isLaundryDrawerOpen, setIsLaundryDrawerOpen] = useState(false);
      const [isPitchModalOpen, setIsPitchModalOpen] = useState(false);

      const baseAvailableCount = clothingList.length;
      const returnedCount = INITIAL_LAUNDRY_ITEMS.length - laundryList.length;
      const totalAvailablePieces = baseAvailableCount + returnedCount;

      const topsCount = Math.round(totalAvailablePieces * 0.41);
      const bottomsCount = Math.round(totalAvailablePieces * 0.32);
      const shoesCount = totalAvailablePieces - topsCount - bottomsCount;

      const handleSelectCategory = (cat) => {
        setSelectedCategory(cat);
        const tops = clothingList.filter((i) => i.type === 'top' && i.category === cat && i.isClean);
        const bottoms = clothingList.filter((i) => i.type === 'bottom' && i.category === cat && i.isClean);
        const shoes = clothingList.filter((i) => i.type === 'shoes' && i.category === cat && i.isClean);

        setCurrentOutfit({
          top: tops.length ? tops[0] : FALLBACK_ITEM('top', cat),
          bottom: bottoms.length ? bottoms[0] : FALLBACK_ITEM('bottom', cat),
          shoes: shoes.length ? shoes[0] : FALLBACK_ITEM('shoes', cat),
        });
      };

      const handleUpdatePiece = (type, item) => {
        setCurrentOutfit((prev) => ({
          ...prev,
          [type]: item,
        }));
      };

      const handleReturnToCloset = (id) => {
        setLaundryList((prev) => prev.filter((item) => item.id !== id));
      };

      const handleReturnAllLaundry = () => {
        setLaundryList([]);
      };

      return (
        <div
          className="relative min-h-screen w-full overflow-x-hidden overflow-y-auto bg-[#14141E] text-white flex flex-col justify-between font-['Tajawal',sans-serif] selection:bg-[#E8A2A8]/30 pb-6 sm:pb-8 touch-scroll"
          dir="rtl"
        >
          {/* Background Mirror Reflection */}
          <div
            className="fixed inset-0 z-0 bg-cover bg-center transition-all duration-700 filter brightness-[0.38] contrast-[1.05]"
            style={{ backgroundImage: `url(${WARDROBE_BG_IMAGE})` }}
          />
          <div className="fixed inset-0 z-0 bg-gradient-to-b from-[#1E1E2C]/70 via-[#1E1E2C]/50 to-[#14141E]/80 backdrop-blur-[2px] pointer-events-none" />

          {/* Wake-up Screen */}
          {isAsleep && (
            <WakeUpScreen
              onWakeUp={() => setIsAsleep(false)}
              weather={currentWeather}
            />
          )}

          {/* Main Content Wrap */}
          <div className="relative z-10 flex-1 flex flex-col justify-between p-3 sm:p-6 md:p-8 max-w-[1440px] mx-auto w-full">
            {/* Header */}
            <div className="w-full flex items-center justify-between pb-3 sm:pb-4 pt-1">
              <div className="flex items-center gap-2 sm:gap-3">
                <h1 className="text-lg sm:text-2xl font-bold tracking-tight text-white/90 drop-shadow font-['Cairo',sans-serif]">
                  مساعد التنسيق الشخصي - EasyWear
                </h1>
                <span className="hidden sm:inline-block text-[11px] px-2.5 py-0.5 rounded-full bg-white/10 text-[#E8A2A8] border border-white/10 font-mono">
                  Smart Glass Mirror
                </span>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setIsAsleep(true)}
                  className="p-2 rounded-2xl bg-white/10 hover:bg-white/20 border border-white/15 text-stone-300 hover:text-white transition-all flex items-center gap-1.5 text-xs shadow-md active:scale-95"
                  title="تفعيل وضع السكون / شاشة الاستيقاظ"
                >
                  <Moon className="w-4 h-4 text-[#E8A2A8]" />
                  <span className="hidden md:inline">وضع السكون</span>
                </button>

                <button
                  onClick={() => setIsPitchModalOpen(true)}
                  className="py-2 px-3 rounded-2xl bg-[#E8A2A8]/20 hover:bg-[#E8A2A8]/30 border border-[#E8A2A8]/40 text-[#E8A2A8] hover:text-white transition-all flex items-center gap-1.5 text-xs font-bold shadow-md active:scale-95"
                  title="معلومات المشروع الأكاديمي"
                >
                  <Info className="w-4 h-4" />
                  <span className="hidden sm:inline">معلومات المشروع</span>
                </button>
              </div>
            </div>

            {/* Grid Layout (Optimized for iPad Landscape & Portrait) */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-5 items-start my-2 sm:my-auto">
              <div className="lg:col-span-8 flex order-1 lg:order-2">
                <MainMirrorPanel
                  selectedCategory={selectedCategory}
                  onSelectCategory={handleSelectCategory}
                  currentOutfit={currentOutfit}
                  onUpdatePiece={handleUpdatePiece}
                  onConfirmOutfit={() => setIsConfirmModalOpen(true)}
                  weather={currentWeather}
                  allItems={clothingList}
                  colorFilter={selectedColorFilter}
                />
              </div>

              <div className="lg:col-span-4 flex flex-col gap-4 sm:gap-5 order-2 lg:order-1">
                <WeatherWidget
                  weather={currentWeather}
                  onSelectWeather={setCurrentWeather}
                  availableWeathers={weatherPresets}
                />

                <WardrobeStatsWidget
                  totalCount={totalAvailablePieces}
                  topsCount={topsCount}
                  bottomsCount={bottomsCount}
                  shoesCount={shoesCount}
                  laundryCount={laundryList.length}
                  onOpenLaundryDrawer={() => setIsLaundryDrawerOpen(true)}
                  activeFilter={inventoryFilter}
                  onFilterChange={setInventoryFilter}
                  selectedColorFilter={selectedColorFilter}
                  onSelectColorFilter={setSelectedColorFilter}
                />
              </div>
            </div>

            {/* Footer */}
            <footer className="w-full pt-3 sm:pt-4 flex flex-col sm:flex-row items-center justify-between text-[11px] sm:text-xs text-stone-400 gap-2 border-t border-white/5 mt-4">
              <div className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-emerald-400" />
                <span>خزانة EasyWear متصلة ومستشعرات RFID نشطة · v2.4</span>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => setIsLaundryDrawerOpen(true)}
                  className="text-stone-300 hover:text-white transition-colors"
                >
                  سلة الغسيل ({laundryList.length})
                </button>
                <span>·</span>
                <button
                  onClick={() => setIsPitchModalOpen(true)}
                  className="text-[#E8A2A8] hover:underline"
                >
                  عرض وثيقة ريادة الأعمال
                </button>
              </div>
            </footer>
          </div>

          {/* Modals */}
          {isConfirmModalOpen && (
            <ConfirmationModal
              outfit={currentOutfit}
              weather={currentWeather}
              onClose={() => setIsConfirmModalOpen(false)}
            />
          )}

          <LaundryDrawer
            isOpen={isLaundryDrawerOpen}
            onClose={() => setIsLaundryDrawerOpen(false)}
            laundryItems={laundryList}
            onReturnToCloset={handleReturnToCloset}
            onReturnAll={handleReturnAllLaundry}
          />

          <BusinessPitchModal
            isOpen={isPitchModalOpen}
            onClose={() => setIsPitchModalOpen(false)}
          />
        </div>
      );
    }

    // Render App into DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
